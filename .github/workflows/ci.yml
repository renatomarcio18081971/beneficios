name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beneficios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beneficios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BENEFICIOS_TEST_CONNECTION: Host=localhost;Port=5432;Database=beneficios;Username=postgres;Password=postgres;Search Path=beneficios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test tests/Beneficios.Tests/Beneficios.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./coverage/

      - name: Check coverage threshold
        run: |
          python3 <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse("tests/Beneficios.Tests/coverage/coverage.opencover.xml")
          summary = tree.getroot().find("Summary")
          coverage = float(summary.attrib["sequenceCoverage"])
          visited = summary.attrib["visitedSequencePoints"]
          total = summary.attrib["numSequencePoints"]
          threshold = 80.0

          print(f"Line coverage: {coverage}% ({visited}/{total} sequence points)")
          if coverage < threshold:
              print(f"Coverage below {threshold}% threshold")
              sys.exit(1)
          PY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-opencover
          path: tests/Beneficios.Tests/coverage/coverage.opencover.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/Beneficios.Tests/TestResults/
