<div class="auth-page">
  <header class="auth-top-bar">
    <img src="/images/login-brand.png" alt="" class="auth-brand-icon" />
  </header>

  <main class="auth-content">
    <mat-card class="auth-card">
      <mat-card-content>
        <div class="auth-card-header">
          <h1 class="auth-card-title">Redefinir senha</h1>
          <p class="auth-card-subtitle">Informe seu e-mail para receber as instruções.</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <label class="field-label" for="email">E-mail</label>
          <mat-form-field appearance="outline" class="full-width">
            <input id="email" matInput type="email" formControlName="email" autocomplete="email">
          </mat-form-field>

          @if (errorMessage) {
            <p class="error-message">{{ errorMessage }}</p>
          }

          <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="loading">
            @if (loading) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Alterar
            }
          </button>
        </form>

        <a routerLink="/login" class="back-link">Voltar ao login</a>
      </mat-card-content>
    </mat-card>
  </main>
</div>
