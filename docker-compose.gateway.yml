services:
  gateway:
    image: nginx:1.27-alpine
    container_name: apps-gateway
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/gateway/certs:/etc/nginx/certs:ro
    networks:
      - apps-gateway

networks:
  apps-gateway:
    name: apps-gateway
    driver: bridge
