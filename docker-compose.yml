services:
  api:
    build:
      context: .
      dockerfile: src/Beneficios.Api/Dockerfile
    container_name: beneficios-api
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env.docker
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: ${DEFAULT_CONNECTION}
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - apps-gateway

  front:
    build:
      context: .
      dockerfile: Beneficios.Front/Dockerfile
    container_name: beneficios-front
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - apps-gateway

networks:
  apps-gateway:
    external: true

volumes:
  api_logs:
