services:
  api:
    build:
      context: .
      dockerfile: src/Beneficios.Api/Dockerfile
    container_name: beneficios-api
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env.docker
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: ${DEFAULT_CONNECTION}
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - beneficios

  front:
    build:
      context: .
      dockerfile: Beneficios.Front/Dockerfile
    container_name: beneficios-front
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - beneficios

  nginx:
    image: nginx:1.27-alpine
    container_name: beneficios-nginx
    restart: unless-stopped
    ports:
      - "9443:443"
      - "9081:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      front:
        condition: service_started
    networks:
      - beneficios

networks:
  beneficios:
    driver: bridge

volumes:
  api_logs:
