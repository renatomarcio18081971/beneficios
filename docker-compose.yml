version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: beneficios-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beneficios
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/Beneficios.Infrastructure/Scripts:/docker-entrypoint-initdb.d
    networks:
      - beneficios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Beneficios.Api/Dockerfile
    container_name: beneficios-api
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=beneficios;Username=postgres;Password=postgres"
      JwtSettings__SecretKey: "sua-chave-secreta-super-segura-com-pelo-menos-32-caracteres"
      JwtSettings__Issuer: "BeneficiosApi"
      JwtSettings__Audience: "BeneficiosClient"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - beneficios-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  beneficios-network:
    driver: bridge
